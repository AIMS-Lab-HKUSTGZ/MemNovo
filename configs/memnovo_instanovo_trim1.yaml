# InstaNovo MemNovo variant: trim precursor token from spectral memory

model:
  name: instanovo
  checkpoint: weights/instanovo-v1.1.0.ckpt

memnovo:
  enabled: true
  residual_scale: 0.005
  apply_to_last_n_layers: 1
  confidence_threshold: null
  target_layers: [-1]
  use_gating: false
  memory_token_trim_left: 1

inference:
  batch_size: 64
  beam_size: 5
  max_length: 30
  device: cuda
  log_interval: 10
  use_knapsack: true
  knapsack_path: knapsack_cache/instanovo_knapsack
  fp16: false
  save_beams: true
  num_workers: 0
  pin_memory: false

evaluation:
  mass_tolerance: 50
  normalize_il: true
