# Baseline InstaNovo Configuration
# No MemNovo enhancement (for comparison)
#
# Use this configuration to run the baseline model without any
# MemNovo modifications for fair comparison.

model:
  name: instanovo
  checkpoint: weights/instanovo-v1.1.0.ckpt

memnovo:
  enabled: false               # MemNovo disabled

inference:
  beam_size: 5
  batch_size: 64
  max_length: 30
  min_length: 1
  log_interval: 10
  use_knapsack: true
  knapsack_path: knapsack_cache/instanovo_knapsack
  fp16: false
  save_beams: true
  num_workers: 0
  pin_memory: false

evaluation:
  mass_tolerance: 50
  normalize_il: true
