# MemNovo Configuration
# Default settings for spectral memory enhancement

# Base model settings
model:
  name: instanovo
  checkpoint: models/instanovo.ckpt

# Enhancement parameters
memnovo:
  enabled: true
  residual_scale: 0.005
  target_layers: [-1]
  use_gating: false

  # Internal strategy identifier
  strategy: default

# Inference settings
inference:
  batch_size: 32
  beam_size: 5
  max_length: 30
  device: cuda

# Data settings
data:
  min_mz: 50.0
  max_mz: 2500.0
  min_intensity: 0.01
