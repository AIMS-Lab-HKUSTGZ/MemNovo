# MemNovo Configuration
# Default settings for spectral memory enhancement

# Base model settings
model:
  name: instanovo
  checkpoint: ../weights/instanovo-v1.1.0.ckpt

# Enhancement parameters
memnovo:
  enabled: true
  residual_scale: 0.005
  apply_to_last_n_layers: 1
  confidence_threshold: null
  target_layers: [-1]
  use_gating: false

# Inference settings
inference:
  batch_size: 64
  beam_size: 5
  max_length: 30
  device: cuda
  use_knapsack: true
  knapsack_path: ../knapsack_cache/instanovo_knapsack
  fp16: true

# Data settings
data:
  min_mz: 50.0
  max_mz: 2500.0
  min_intensity: 0.01

evaluation:
  mass_tolerance: 50
  normalize_il: true
