# InstaNovo probe configuration for throughput checks

model:
  name: instanovo
  checkpoint: ../weights/instanovo-v1.1.0.ckpt

memnovo:
  enabled: false

inference:
  beam_size: 5
  batch_size: 64
  max_length: 30
  min_length: 1
  log_interval: 1
  use_knapsack: true
  knapsack_path: ../knapsack_cache/instanovo_knapsack
  fp16: false
  save_beams: false
  num_workers: 0
  pin_memory: false

evaluation:
  mass_tolerance: 50
  normalize_il: true
