# Official CLI baseline configuration
# This will generate baseline results using InstaNovo's official inference pipeline

# Data paths
data_path: dataset/NS3/Mus-musculus.mgf
instanovo_model: weights/instanovo-v1.1.0.ckpt
output_path: results_cli/baseline_cli.csv

# Inference mode
denovo: False  # evaluation mode
num_beams: 5
max_length: 40
max_charge: 10
isotope_error_range: [0, 1]
subset: 0.00392  # ~100 samples out of 25541
use_knapsack: False
save_beams: True  # Save all beams for analysis

# Run config
batch_size: 32
device: auto
fp16: True

# Logging
log_interval: 5
use_basic_logging: False  # Use tqdm for progress

# Metrics config
filter_precursor_ppm: 20
filter_confidence: 1e-4
filter_fdr_threshold: 0.05

# Dataset specific configs (from default.yaml)
residue_remapping:
  "M(ox)": "M[UNIMOD:35]"
  "M(+15.99)": "M[UNIMOD:35]"
  "S(p)": "S[UNIMOD:21]"
  "T(p)": "T[UNIMOD:21]"
  "Y(p)": "Y[UNIMOD:21]"
  "S(+79.97)": "S[UNIMOD:21]"
  "T(+79.97)": "T[UNIMOD:21]"
  "Y(+79.97)": "Y[UNIMOD:21]"
  "Q(+0.98)": "Q[UNIMOD:7]"
  "N(+0.98)": "N[UNIMOD:7]"
  "Q(+.98)": "Q[UNIMOD:7]"
  "N(+.98)": "N[UNIMOD:7]"
  "C(+57.02)": "C[UNIMOD:4]"
  "(+42.01)": "[UNIMOD:1]"
  "(+43.01)": "[UNIMOD:5]"
  "(+25.98)": "[UNIMOD:34]"
  "(-17.03)": "[UNIMOD:385]"

column_map:
  "Modified sequence": "modified_sequence"
  "MS/MS m/z": "precursor_mz"
  "Mass": "precursor_mass"
  "Charge": "precursor_charge"
  "Mass values": "mz_array"
  "Mass spectrum": "mz_array"
  "Intensity": "intensity_array"
  "Raw intensity spectrum": "intensity_array"
  "Scan number": "scan_number"

index_columns:
  - "spectrum_id"
  - "scan_number"
  - "precursor_mz"
  - "precursor_charge"
